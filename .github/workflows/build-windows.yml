name: Build Windows installer

# Builds the .exe installer on a real Windows machine in GitHub's cloud —
# no local Windows box or Wine needed. Runs automatically on every push to
# main, and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: weplay-hand-tracker-windows-installer
          path: dist/*.exe
