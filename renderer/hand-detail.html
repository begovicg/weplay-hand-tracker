<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hand detail</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="hand-detail.css" />
</head>
<body class="hand-detail-body">
  <div class="hd-toolbar">
    <div id="hdToolbarTitle" class="hd-toolbar-title">Loading…</div>
    <div class="hd-toolbar-actions">
      <button id="replayHandBtn" class="hd-icon-btn" title="Replay hand" disabled>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><polygon points="6,4 20,12 6,20"></polygon></svg>
      </button>
      <button id="downloadHandBtn" class="hd-icon-btn" title="Download as image">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="4" y1="20" x2="20" y2="20"></line></svg>
      </button>
    </div>
  </div>

  <div id="handFormatted" class="hand-formatted">Loading…</div>

  <script src="hand-detail.js"></script>
</body>
</html>
